<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../css/login.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body
    class="m-auto d-flex align-content-center justify-content-center align-items-center"
  >
    <div class="container container-custom">
      <div class="box row d-flex">
        <div class="col-6 p-4 left">
          <div class="d-flex flex-column gap-4 align-content-center">
            <div class="d-flex justify-content-center gap-2 align-items-center">
              <i class="fa-solid fa-arrow-right-to-bracket display-6"></i>
              <h1 class="fw-bold">Login</h1>
            </div>
            <div
              class="social-list d-flex justify-content-center align-items-center gap-4 g-4 align-content-center"
            >
              <i
                class="icon fa-brands fa-facebook-f d-flex justify-content-center align-content-center"
              ></i>
              <i
                class="icon fa-brands fa-google d-flex justify-content-center align-content-center"
              ></i>
              <i
                class="icon fa-brands fa-linkedin-in d-flex justify-content-center align-content-center"
              ></i>
            </div>
            <div
              class="d-flex flex-column gap-2 g-2 text-center justify-content-center"
            >
              <span class="text-center">Or use your account</span>
              <div class="mt-3 text-input w-100 d-flex flex-column gap-3">
                <input
                  class="input-email rounded-pill"
                  type="text"
                  placeholder="Email"
                />
                <input
                  class="input-password rounded-pill"
                  type="password"
                  placeholder="Password"
                />
              </div>
              <a class="text-primary mt-3 text-decoration-none" href=""
                >Forgot Passwords?</a
              >
              <div class="btn-login">
                <button
                  type="button"
                  class=" btn btn-primary rounded-pill w-25 mt-3 py-2 px-4"
                >
                  Login
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 p-0">
          <div class="right">
            <div
              class="d-flex flex-column justify-content-center align-items-center align-content-center g-4 gap-4 text-light h-100"
            >
              <h1>Welcome!</h1>
              <p>Enter your personal details and start your journey with us.</p>
              <div class="">
                <button
                  type="button"
                  class="btn rounded-pill border-light bg-transparent mt-3 px-5 py-3 text-light fw-bold border-2"
                >
                  Register
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>

  </body>
</html>
